<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vo Waveform HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    .hud-capsule {
      height: 26px;
      min-width: 78px;
      max-width: 270px;
      background: rgba(24, 25, 32, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 3px 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: drag;
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
    }

    .hud-capsule:active {
      cursor: grabbing;
    }

    /* State icons */
    .hud-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 12px;
      height: 12px;
    }
    .hud-icon svg {
      width: 12px;
      height: 12px;
    }

    /* Bars container */
    .hud-bars {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 18px;
      flex-shrink: 0;
    }
    .hud-bar {
      width: 3px;
      height: 6px;
      background: #10B981;
      border-radius: 3px;
      transition: height 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Contextual Labels */
    .hud-label {
      display: none;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      line-height: 1.1;
      margin: 0 2px;
      max-width: 150px;
    }
    .hud-capsule.expanded .hud-label,
    .hud-capsule:hover .hud-label {
      display: flex;
    }
    .hud-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-detail {
      font-size: 8.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Cancel & Action Buttons */
    .hud-action-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      -webkit-app-region: no-drag;
      transition: background 0.15s ease, transform 0.1s ease;
      padding: 0;
    }
    .hud-action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #FFF;
    }
    .hud-action-btn:active {
      transform: scale(0.92);
    }
    .hud-capsule.expanded .hud-action-btn,
    .hud-capsule:hover .hud-action-btn {
      display: inline-flex;
    }

    /* --- STATES --- */

    /* 1. STARTING (Soft Cyan Pulse) */
    .hud-capsule.starting {
      border-color: rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.starting .hud-bar {
      background: #06B6D4;
      box-shadow: 0 0 6px rgba(6, 182, 212, 0.6);
      animation: wave-cyan 0.6s ease-in-out infinite alternate;
    }
    .hud-capsule.starting .hud-bar:nth-child(1) { animation-delay: 0.05s; }
    .hud-capsule.starting .hud-bar:nth-child(2) { animation-delay: 0.20s; }
    .hud-capsule.starting .hud-bar:nth-child(3) { animation-delay: 0.10s; }
    .hud-capsule.starting .hud-bar:nth-child(4) { animation-delay: 0.25s; }
    .hud-capsule.starting .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 2. RECORDING (Ruby Red) */
    .hud-capsule.recording {
      border-color: rgba(239, 68, 68, 0.4);
    }
    .hud-capsule.recording .hud-bar {
      background: #EF4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
      animation: wave-red 0.55s ease-in-out infinite alternate;
    }
    .hud-capsule.recording .hud-bar:nth-child(1) { animation-delay: 0.05s; }
    .hud-capsule.recording .hud-bar:nth-child(2) { animation-delay: 0.20s; }
    .hud-capsule.recording .hud-bar:nth-child(3) { animation-delay: 0.10s; }
    .hud-capsule.recording .hud-bar:nth-child(4) { animation-delay: 0.30s; }
    .hud-capsule.recording .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 3. TRANSCRIBING & STOPPING (Amber) */
    .hud-capsule.transcribing,
    .hud-capsule.stopping {
      border-color: rgba(245, 158, 11, 0.45);
    }
    .hud-capsule.transcribing .hud-bar,
    .hud-capsule.stopping .hud-bar {
      background: #F59E0B;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
      animation: wave-yellow 0.45s ease-in-out infinite alternate;
    }
    .hud-capsule.transcribing .hud-bar:nth-child(1),
    .hud-capsule.stopping .hud-bar:nth-child(1) { animation-delay: 0.10s; }
    .hud-capsule.transcribing .hud-bar:nth-child(2),
    .hud-capsule.stopping .hud-bar:nth-child(2) { animation-delay: 0.25s; }
    .hud-capsule.transcribing .hud-bar:nth-child(3),
    .hud-capsule.stopping .hud-bar:nth-child(3) { animation-delay: 0.05s; }
    .hud-capsule.transcribing .hud-bar:nth-child(4),
    .hud-capsule.stopping .hud-bar:nth-child(4) { animation-delay: 0.35s; }
    .hud-capsule.transcribing .hud-bar:nth-child(5),
    .hud-capsule.stopping .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 4. THINKING (Indigo/Purple) */
    .hud-capsule.thinking {
      border-color: rgba(139, 92, 246, 0.45);
    }
    .hud-capsule.thinking .hud-bar {
      background: #8B5CF6;
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.6);
      animation: wave-purple 0.5s ease-in-out infinite alternate;
    }

    /* 5. SPEAKING (Blue) */
    .hud-capsule.speaking {
      border-color: rgba(59, 130, 246, 0.45);
    }
    .hud-capsule.speaking .hud-bar {
      background: #3B82F6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
      animation: wave-blue 0.5s ease-in-out infinite alternate;
    }

    /* 6. IDLE & SUCCESS (Emerald Green) */
    .hud-capsule.idle .hud-bar,
    .hud-capsule.success .hud-bar {
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
      height: 10px;
    }

    /* 7. ERROR (Alert Orange/Red) */
    .hud-capsule.error {
      border-color: rgba(249, 115, 22, 0.65);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.35), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.error .hud-bar {
      background: #F97316;
      box-shadow: 0 0 6px rgba(249, 115, 22, 0.7);
      height: 8px;
    }

    /* 8. SELECTION TRANSFORM MODE (Violet Glow) */
    .hud-capsule.has-selection {
      border: 1.5px solid rgba(192, 132, 252, 0.75);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.55), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.has-selection.recording .hud-bar {
      background: #C084FC;
      box-shadow: 0 0 8px rgba(192, 132, 252, 0.9);
    }

    /* Keyframe Animations */
    @keyframes wave-cyan {
      0% { height: 4px; }
      100% { height: 12px; }
    }
    @keyframes wave-red {
      0% { height: 4px; }
      100% { height: 15px; }
    }
    @keyframes wave-yellow {
      0% { height: 5px; }
      100% { height: 16px; }
    }
    @keyframes wave-purple {
      0% { height: 4px; }
      100% { height: 14px; }
    }
    @keyframes wave-blue {
      0% { height: 5px; }
      100% { height: 15px; }
    }

    /* Reduced Motion Handling */
    @media (prefers-reduced-motion: reduce) {
      .hud-capsule,
      .hud-bar,
      .hud-action-btn {
        transition: none !important;
      }
      .hud-capsule.recording .hud-bar,
      .hud-capsule.starting .hud-bar,
      .hud-capsule.transcribing .hud-bar,
      .hud-capsule.stopping .hud-bar,
      .hud-capsule.thinking .hud-bar,
      .hud-capsule.speaking .hud-bar {
        animation: none !important;
      }
      .hud-bar:nth-child(1) { height: 6px; }
      .hud-bar:nth-child(2) { height: 14px; }
      .hud-bar:nth-child(3) { height: 10px; }
      .hud-bar:nth-child(4) { height: 16px; }
      .hud-bar:nth-child(5) { height: 8px; }
    }
  </style>
</head>
<body>
  <div id="hudCapsule" class="hud-capsule idle" role="status" aria-live="polite">
    <div id="hudIcon" class="hud-icon"></div>
    
    <div class="hud-bars">
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
    </div>

    <div id="hudLabel" class="hud-label">
      <span id="hudTitle" class="hud-title">READY</span>
      <span id="hudDetail" class="hud-detail"></span>
    </div>

    <button id="hudCancelBtn" class="hud-action-btn" aria-label="Cancel dictation" title="Cancel (Esc)">✕</button>
  </div>

  <script>
    const hudCapsule = document.getElementById("hudCapsule");
    const hudIcon = document.getElementById("hudIcon");
    const hudTitle = document.getElementById("hudTitle");
    const hudDetail = document.getElementById("hudDetail");
    const hudCancelBtn = document.getElementById("hudCancelBtn");

    const stateIcons = {
      idle: `<svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      starting: `<svg viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="3"><circle cx="12" cy="12" r="8" stroke-dasharray="12 12" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1.5s" repeatCount="indefinite"/></circle></svg>`,
      recording: `<svg viewBox="0 0 24 24" fill="#EF4444"><circle cx="12" cy="12" r="7"/></svg>`,
      stopping: `<svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="3"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`,
      transcribing: `<svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
      thinking: `<svg viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8c0 3 2 5.5 4 7v2a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2c2-1.5 4-4 4-7a8 8 0 0 0-8-8z"/></svg>`,
      speaking: `<svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
      error: `<svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      selection: `<svg viewBox="0 0 24 24" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`
    };

    const defaultTitles = {
      idle: "DONE",
      starting: "STARTING",
      recording: "RECORDING",
      stopping: "STOPPING",
      transcribing: "TRANSCRIBING",
      thinking: "THINKING",
      speaking: "SPEAKING",
      error: "ERROR"
    };

    const defaultDetails = {
      starting: "Connecting...",
      recording: "Listening...",
      stopping: "Finalizing...",
      transcribing: "Preparing text...",
      thinking: "Processing...",
      speaking: "Synthesizing...",
      error: "An error occurred"
    };

    // Prevent cancellation button click from stealing window focus
    hudCancelBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
    });

    hudCancelBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const api = window.electronIPC || window.piVoice;
      if (api && api.cancelDictation) {
        api.cancelDictation();
      }
    });

    function updateHud(payload) {
      if (!payload) return;
      const state = payload.state || "idle";
      const hasSelection = Boolean(payload.hasSelection);
      const msg = payload.message || "";

      hudCapsule.className = "hud-capsule " + state + (hasSelection ? " has-selection" : "");
      
      const isExpanded = state !== "idle" || hasSelection || Boolean(msg);
      if (isExpanded) {
        hudCapsule.classList.add("expanded");
      } else {
        hudCapsule.classList.remove("expanded");
      }

      // Pick icon
      if (hasSelection && state !== "error") {
        hudIcon.innerHTML = stateIcons.selection;
      } else if (stateIcons[state]) {
        hudIcon.innerHTML = stateIcons[state];
      } else {
        hudIcon.innerHTML = stateIcons.idle;
      }

      // Pick titles and details
      if (hasSelection && state === "recording") {
        hudTitle.textContent = "EDITING";
        hudDetail.textContent = msg || "Transform selection";
      } else if (hasSelection && state === "idle") {
        hudTitle.textContent = "SELECTION";
        hudDetail.textContent = msg || "Edit selected text";
      } else {
        hudTitle.textContent = defaultTitles[state] || state.toUpperCase();
        hudDetail.textContent = msg || defaultDetails[state] || "";
      }

      // Cancel button text / accessibility label
      if (state === "error") {
        hudCancelBtn.textContent = "✕";
        hudCancelBtn.setAttribute("aria-label", "Dismiss error");
        hudCancelBtn.setAttribute("title", "Dismiss");
      } else {
        hudCancelBtn.textContent = "✕";
        hudCancelBtn.setAttribute("aria-label", "Cancel dictation");
        hudCancelBtn.setAttribute("title", "Cancel (Esc)");
      }
    }

    const api = window.electronIPC || window.piVoice;
    if (api) {
      if (api.onStateChanged) {
        api.onStateChanged(updateHud);
      }

      const audioHandler = (payload) => {
        if (hudCapsule.classList.contains("recording")) {
          const level = typeof payload === "object" ? payload.level : payload;
          const clamped = Math.max(0.1, Math.min(1, (level || 0) * 2.5));
          const bars = document.querySelectorAll(".hud-bar");
          for (let i = 0; i < bars.length; i++) {
            const h = Math.round(4 + clamped * (10 + (i % 3) * 3));
            bars[i].style.height = h + "px";
          }
        }
      };

      if (api.onAudioLevelUpdate) {
        api.onAudioLevelUpdate(audioHandler);
      }
    }
  </script>
</body>
</html>

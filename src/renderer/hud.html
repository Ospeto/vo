<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-src 'none';">
  <title>vo Waveform HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    .hud-capsule {
      height: 26px;
      min-width: 78px;
      max-width: 270px;
      background: rgba(24, 25, 32, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 3px 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: drag;
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
    }

    .hud-capsule:active {
      cursor: grabbing;
    }

    /* State icons */
    .hud-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 12px;
      height: 12px;
    }
    .hud-icon svg {
      width: 12px;
      height: 12px;
    }

    /* Bars container */
    .hud-bars {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 18px;
      flex-shrink: 0;
    }
    .hud-bar {
      width: 3px;
      height: 6px;
      background: #10B981;
      border-radius: 3px;
      transition: height 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Contextual Labels */
    .hud-label {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 0;
      line-height: 1;
      margin: 0 4px;
      max-width: 180px;
    }
    .hud-capsule.expanded .hud-label,
    .hud-capsule:hover .hud-label {
      display: inline-flex;
    }
    .hud-title {
      font-size: 9.5px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hud-detail {
      display: none;
    }

    /* Cancel & Action Buttons */
    .hud-action-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      -webkit-app-region: no-drag;
      transition: background 0.15s ease, transform 0.1s ease;
      padding: 0;
    }
    .hud-action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #FFF;
    }
    .hud-action-btn:active {
      transform: scale(0.92);
    }
    .hud-capsule.expanded .hud-action-btn,
    .hud-capsule:hover .hud-action-btn {
      display: inline-flex;
    }

    /* Paid Key Badge */
    .hud-paid-badge {
      display: none;
      align-items: center;
      justify-content: center;
      height: 14px;
      padding: 0 5px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 9999px;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.3);
      flex-shrink: 0;
    }

    /* --- STATES --- */

    /* 1. STARTING (Soft Cyan Pulse) */
    .hud-capsule.starting {
      border-color: rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.starting .hud-bar {
      background: #06B6D4;
      box-shadow: 0 0 6px rgba(6, 182, 212, 0.6);
      animation: wave-cyan 0.6s ease-in-out infinite alternate;
    }
    .hud-capsule.starting .hud-bar:nth-child(1) { animation-delay: 0.05s; }
    .hud-capsule.starting .hud-bar:nth-child(2) { animation-delay: 0.20s; }
    .hud-capsule.starting .hud-bar:nth-child(3) { animation-delay: 0.10s; }
    .hud-capsule.starting .hud-bar:nth-child(4) { animation-delay: 0.25s; }
    .hud-capsule.starting .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 2. RECORDING (Ruby Red) */
    .hud-capsule.recording {
      border-color: rgba(239, 68, 68, 0.4);
    }
    .hud-capsule.recording .hud-bar {
      background: #EF4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
      animation: wave-red 0.55s ease-in-out infinite alternate;
    }
    .hud-capsule.recording .hud-bar:nth-child(1) { animation-delay: 0.05s; }
    .hud-capsule.recording .hud-bar:nth-child(2) { animation-delay: 0.20s; }
    .hud-capsule.recording .hud-bar:nth-child(3) { animation-delay: 0.10s; }
    .hud-capsule.recording .hud-bar:nth-child(4) { animation-delay: 0.30s; }
    .hud-capsule.recording .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 3. TRANSCRIBING & STOPPING (Amber) */
    .hud-capsule.transcribing,
    .hud-capsule.stopping {
      border-color: rgba(245, 158, 11, 0.45);
    }
    .hud-capsule.transcribing .hud-bar,
    .hud-capsule.stopping .hud-bar {
      background: #F59E0B;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
      animation: wave-yellow 0.45s ease-in-out infinite alternate;
    }
    .hud-capsule.transcribing .hud-bar:nth-child(1),
    .hud-capsule.stopping .hud-bar:nth-child(1) { animation-delay: 0.10s; }
    .hud-capsule.transcribing .hud-bar:nth-child(2),
    .hud-capsule.stopping .hud-bar:nth-child(2) { animation-delay: 0.25s; }
    .hud-capsule.transcribing .hud-bar:nth-child(3),
    .hud-capsule.stopping .hud-bar:nth-child(3) { animation-delay: 0.05s; }
    .hud-capsule.transcribing .hud-bar:nth-child(4),
    .hud-capsule.stopping .hud-bar:nth-child(4) { animation-delay: 0.35s; }
    .hud-capsule.transcribing .hud-bar:nth-child(5),
    .hud-capsule.stopping .hud-bar:nth-child(5) { animation-delay: 0.15s; }

    /* 4. THINKING (Indigo/Purple) */
    .hud-capsule.thinking {
      border-color: rgba(139, 92, 246, 0.45);
    }
    .hud-capsule.thinking .hud-bar {
      background: #8B5CF6;
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.6);
      animation: wave-purple 0.5s ease-in-out infinite alternate;
    }

    /* 5. SPEAKING (Blue) */
    .hud-capsule.speaking {
      border-color: rgba(59, 130, 246, 0.45);
    }
    .hud-capsule.speaking .hud-bar {
      background: #3B82F6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
      animation: wave-blue 0.5s ease-in-out infinite alternate;
    }

    /* 6. IDLE & SUCCESS (Emerald Green) */
    .hud-capsule.idle .hud-bar,
    .hud-capsule.success .hud-bar {
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
      height: 10px;
    }

    /* 7. ERROR (Alert Orange/Red) */
    .hud-capsule.error {
      border-color: rgba(249, 115, 22, 0.65);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.35), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.error .hud-bar {
      background: #F97316;
      box-shadow: 0 0 6px rgba(249, 115, 22, 0.7);
      height: 8px;
    }

    /* 8. SELECTION TRANSFORM MODE (Violet Glow) */
    .hud-capsule.has-selection {
      border: 1.5px solid rgba(192, 132, 252, 0.75);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.55), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .hud-capsule.has-selection.recording .hud-bar,
    .hud-capsule.has-selection.starting .hud-bar,
    .hud-capsule.has-selection.stopping .hud-bar,
    .hud-capsule.has-selection.transcribing .hud-bar {
      background: #C084FC;
      box-shadow: 0 0 8px rgba(192, 132, 252, 0.9);
    }

    /* Keyframe Animations */
    @keyframes wave-cyan {
      0% { height: 4px; }
      100% { height: 12px; }
    }
    @keyframes wave-red {
      0% { height: 4px; }
      100% { height: 15px; }
    }
    @keyframes wave-yellow {
      0% { height: 5px; }
      100% { height: 16px; }
    }
    @keyframes wave-purple {
      0% { height: 4px; }
      100% { height: 14px; }
    }
    @keyframes wave-blue {
      0% { height: 5px; }
      100% { height: 15px; }
    }

    /* Reduced Motion Handling */
    @media (prefers-reduced-motion: reduce) {
      .hud-capsule,
      .hud-bar,
      .hud-action-btn {
        transition: none !important;
      }
      .hud-capsule.recording .hud-bar,
      .hud-capsule.starting .hud-bar,
      .hud-capsule.transcribing .hud-bar,
      .hud-capsule.stopping .hud-bar,
      .hud-capsule.thinking .hud-bar,
      .hud-capsule.speaking .hud-bar {
        animation: none !important;
      }
      .hud-bar:nth-child(1) { height: 6px; }
      .hud-bar:nth-child(2) { height: 14px; }
      .hud-bar:nth-child(3) { height: 10px; }
      .hud-bar:nth-child(4) { height: 16px; }
      .hud-bar:nth-child(5) { height: 8px; }
    }
  </style>
</head>
<body>
  <div id="hudCapsule" class="hud-capsule idle" role="status" aria-live="polite">
    <div id="hudIcon" class="hud-icon"></div>

    <div class="hud-bars">
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
      <div class="hud-bar"></div>
    </div>

    <div id="hudLabel" class="hud-label">
      <span id="hudTitle" class="hud-title">READY</span>
      <span id="hudDetail" class="hud-detail"></span>
    </div>

    <span id="hudPaidBadge" class="hud-paid-badge">$ Paid</span>

    <button id="hudCancelBtn" class="hud-action-btn" aria-label="Cancel dictation" title="Cancel (Esc)">✕</button>
  </div>

  <script type="module" src="./hud.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container" role="main">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="url(#grad1)"/>
            <path d="M9.5 16.5l7-4.5-7-4.5v9z" fill="#007AFF"/>
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#007AFF"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="title">vo</span>
      </div>
      <div class="header-right">
        <div id="statusBadge" class="status-badge" aria-live="polite">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusLabel">Ready</span>
        </div>
        <button id="configBtn" class="icon-action-btn config-header-btn" title="Vocabulary & Settings" aria-label="Vocabulary & Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Controls Row 1: Mode & Preset Selectors -->
    <div class="control-grid">
      <div class="field-group">
        <label for="presetSelect">Preset</label>
        <select id="presetSelect" aria-label="Dictation Preset">
          <option value="careful" selected>Careful (Default)</option>
          <option value="auto">Auto (Smart)</option>
          <option value="fast">Fast</option>
          <option value="code_comment">Code</option>
          <option value="email_polish">Email</option>
          <option value="burmese_written">Burmese</option>
          <option value="translate_en">Translate (EN)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="modeSelect">Trigger</label>
        <select id="modeSelect" aria-label="Trigger Mode">
          <option value="toggle">Tap</option>
          <option value="hold">Hold</option>
        </select>
      </div>
      <div class="field-group">
        <label for="modelSelect">Model</label>
        <select id="modelSelect" aria-label="Gemini Model">
          <option value="gemini-3.6-flash">3.6 Flash</option>
          <option value="gemini-3.5-flash-lite">3.5 Flash Lite</option>
          <option value="gemini-3.1-flash-lite" selected>3.1 Flash Lite (Default)</option>
          <option value="gemini-2.5-flash">2.5 Flash</option>
          <option value="gemini-2.5-pro">2.5 Pro</option>
        </select>
      </div>
    </div>

    <!-- Volume & Chime Bar -->
    <div class="volume-row">
      <svg class="mic-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <input 
        type="range" 
        id="gainSlider" 
        min="0.00" 
        max="2.00" 
        step="0.05" 
        value="1.00" 
        aria-label="Input Gain" 
      >
      <span id="gainValue" class="gain-text">1.00×</span>
      <button id="chimeBtn" class="icon-toggle active" title="Toggle Audio Chimes" aria-label="Toggle Audio Chimes">
        <svg class="bell-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </div>

    <!-- Minimal Gray Audio Waveform Visualizer Canvas -->
    <canvas id="spectrumCanvas" width="280" height="28" class="spectrum-canvas"></canvas>

    <!-- Recent History List -->
    <div class="history-section">
      <div class="history-header">
        <span>Recent Dictations</span>
        <div class="history-header-actions">
          <span id="monthlyCostBadge" class="cost-badge" title="Estimated monthly Gemini API usage cost">Month: $0.0000</span>
          <button id="clearHistoryBtn" class="link-btn" aria-label="Clear History">Clear</button>
        </div>
      </div>
      <div id="historyContainer" class="history-list">
        <div class="history-empty">No recent dictations</div>
      </div>
    </div>
  </div>

  <!-- Settings / Vocabulary Modal Overlay -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span>⚙️ Settings & Mode Vocabulary</span>
        <button id="closeModalBtn" class="close-btn" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Global Dictation Shortcut Section -->
        <div class="modal-section-group">
          <label class="section-label">Global Dictation Shortcut</label>
          <div class="shortcut-settings-row">
            <span id="keycapDisplay" class="keycaps">⌃⌥⌘V</span>
            <button id="recordBtn" class="action-btn">Record Shortcut</button>
            <button id="resetShortcutBtn" class="link-btn-danger" title="Reset to ⌃⌥⌘V">Reset</button>
          </div>
          <span id="hotkeyFeedback" class="feedback-msg"></span>
        </div>

        <hr class="modal-divider">

        <!-- Gemini API Key Section -->
        <div class="modal-section-group">
          <label class="section-label" for="geminiApiKeyInput">Gemini API Key</label>
          <div class="apiKey-settings-row">
            <input type="password" id="geminiApiKeyInput" placeholder="AIzaSy... (Paste Gemini API Key)" aria-label="Gemini API Key">
            <button id="testApiKeyBtn" class="action-btn-sm action-btn-blue" title="Test API Key">Test</button>
            <button id="saveApiKeyBtn" class="action-btn-sm">Save</button>
          </div>
          <span id="apiKeyFeedback" class="feedback-msg"></span>
        <!-- Microphone Input Device Section -->
        <div class="modal-section-group">
          <label class="section-label" for="micDeviceSelect">Microphone Input Device</label>
          <div class="chime-card-row">
            <div class="chime-card-header">
              <span class="chime-step-badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">Audio Input</span>
              <span class="chime-step-title">Hardware Mic</span>
            </div>
            <div class="chime-card-controls">
              <select id="micDeviceSelect" class="chime-select" aria-label="Microphone Input Device">
                <option value="default">System Default Microphone</option>
              </select>
            </div>
          </div>
        </div>

        <hr class="modal-divider">

        <!-- Default Gemini Model Section -->
        <div class="modal-section-group">
          <label class="section-label" for="settingModelSelect">Default Gemini Model</label>
          <div class="chime-card-row">
            <div class="chime-card-header">
              <span class="chime-step-badge" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa;">AI Model</span>
              <span class="chime-step-title">Default Speech Engine</span>
            </div>
            <div class="chime-card-controls">
              <select id="settingModelSelect" class="chime-select" aria-label="Default Gemini Model">
                <option value="gemini-3.1-flash-lite">3.1 Flash Lite (Default)</option>
                <option value="gemini-3.5-flash-lite">3.5 Flash Lite</option>
                <option value="gemini-3.6-flash">3.6 Flash</option>
                <option value="gemini-2.5-flash">2.5 Flash</option>
                <option value="gemini-2.5-pro">2.5 Pro (Highest Accuracy)</option>
              </select>
            </div>
          </div>
        </div>

        <hr class="modal-divider">

        <!-- Notification Audio Chimes Sound Settings Section -->
        <div class="modal-section-group">
          <label class="section-label">Notification Audio Chimes</label>
          
          <!-- Step 1: Start Recording Tone Card -->
          <div class="chime-card-row">
            <div class="chime-card-header">
              <span class="chime-step-badge">Step 1</span>
              <span class="chime-step-title">Start Recording Tone</span>
            </div>
            <div class="chime-card-controls">
              <select id="chimeStartSelect" class="chime-select" aria-label="Start Chime Sound">
                <option value="glass">Glass (Classic)</option>
                <option value="ping">Ping (Metallic)</option>
                <option value="pop">Pop (Soft Bubble)</option>
                <option value="tink">Tink (High Chime)</option>
                <option value="submarine">Submarine (Sonar)</option>
                <option value="hero">Hero (Triumph)</option>
              </select>
              <button id="previewStartChimeBtn" class="chime-preview-btn" title="Preview Start Chime">
                🔊 Preview
              </button>
            </div>
          </div>

          <!-- Step 2: Completion Alert Tone Card -->
          <div class="chime-card-row">
            <div class="chime-card-header">
              <span class="chime-step-badge">Step 2</span>
              <span class="chime-step-title">Completion Alert Tone</span>
            </div>
            <div class="chime-card-controls">
              <select id="chimeEndSelect" class="chime-select" aria-label="Completion Chime Sound">
                <option value="submarine">Submarine (Default)</option>
                <option value="hero">Hero (Triumph)</option>
                <option value="glass">Glass (Classic)</option>
                <option value="ping">Ping (Metallic)</option>
                <option value="pop">Pop (Soft Bubble)</option>
                <option value="tink">Tink (High Chime)</option>
              </select>
              <button id="previewEndChimeBtn" class="chime-preview-btn" title="Preview End Chime">
                🔊 Preview
              </button>
            </div>
          </div>
        </div>

        <hr class="modal-divider">

        <!-- Dynamic Workspace Symbol Scanner Toggle Section -->
        <div class="modal-section-group">
          <div class="sound-setting-row" style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <label for="symbolScannerToggle" style="font-size: 11.5px; font-weight: 600; color: #f4f4f5; display: block;">Dynamic Symbol Scanner</label>
              <span style="font-size: 9.5px; color: #a1a1aa; display: block; margin-top: 1px;">Auto-extract project symbols to prevent code hallucinations</span>
            </div>
            <input type="checkbox" id="symbolScannerToggle" checked style="width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer;">
          </div>
        </div>

        <hr class="modal-divider">

        <!-- Preset Mode Vocabulary Section -->
        <div class="field-group">
          <label for="modalPresetSelect">Preset Mode Vocabulary</label>
          <select id="modalPresetSelect" aria-label="Preset Vocabulary Mode">
            <option value="code_comment">Code</option>
            <option value="email_polish">Email</option>
            <option value="burmese_written">Burmese</option>
            <option value="translate_en">Translate (EN)</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="vocab-input-row">
          <input type="text" id="vocabInput" placeholder="Type term (e.g. TypeScript)..." aria-label="Add custom term">
          <button id="addVocabBtn" class="action-btn-sm">+ Add</button>
        </div>
        <div id="vocabTagsContainer" class="vocab-tags"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./renderer.ts"></script>
</body>
</html>
